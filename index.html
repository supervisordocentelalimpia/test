<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Oral Rating Form - CEVAZ</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #003366; }
        .criterion { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Oral Rating Form - CEVAZ</h1>
    
    <div class="criterion">
        <h2>Pronunciation</h2>
        <input type="radio" name="pronunciation" value="1"> 1
        <input type="radio" name="pronunciation" value="2"> 2
        <input type="radio" name="pronunciation" value="3"> 3
        <input type="radio" name="pronunciation" value="4"> 4
        <input type="radio" name="pronunciation" value="5"> 5
    </div>

    <div class="criterion">
        <h2>Grammar</h2>
        <input type="radio" name="grammar" value="1"> 1
        <input type="radio" name="grammar" value="2"> 2
        <input type="radio" name="grammar" value="3"> 3
        <input type="radio" name="grammar" value="4"> 4
        <input type="radio" name="grammar" value="5"> 5
    </div>
</body>
</html>
